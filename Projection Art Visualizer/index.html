<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinect Projection Art Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            padding: 20px;
            color: #fff;
            max-width: 300px;
            font-size: 12px;
            z-index: 1000;
            transition: opacity 0.3s;
        }

        #controls.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 11px;
            text-transform: uppercase;
        }

        select, input[type="range"], button {
            width: 100%;
            padding: 5px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            font-family: inherit;
        }

        input[type="range"] {
            padding: 0;
        }

        button {
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }

        button:hover {
            background: #333;
        }

        .slider-value {
            float: right;
            color: #0f0;
        }

        h3 {
            margin-bottom: 15px;
            color: #0f0;
            font-size: 14px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        #toggle-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            color: #0f0;
            padding: 10px 15px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            z-index: 1001;
        }

        #fps {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #0f0;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <button id="toggle-controls">Toggle Controls [H]</button>

    <div id="controls">
        <h3>Projection Art Visualizer</h3>

        <div class="control-group">
            <label>Visualization Mode</label>
            <select id="viz-mode">
                <option value="particleField">Particle Flow Field</option>
                <option value="fluidDynamics">Fluid Dynamics</option>
                <option value="cloth">Verlet Cloth</option>
                <option value="boids">Boids/Flocking</option>
                <option value="waves">Wave Interference</option>
                <option value="rain">Rain</option>
                <option value="gravity">Gravity & Orbits</option>
                <option value="waterWaves">Water Waves</option>
                <option value="moire">Moiré Patterns</option>
            </select>
        </div>

        <div id="particle-controls">
            <div class="control-group">
                <label>Particle Count <span class="slider-value" id="particle-count-val">5000</span></label>
                <input type="range" id="particle-count" min="1000" max="50000" value="5000" step="1000">
            </div>

            <div class="control-group">
                <label>Force Strength <span class="slider-value" id="force-strength-val">1.0</span></label>
                <input type="range" id="force-strength" min="0.1" max="5.0" value="1.0" step="0.1">
            </div>

            <div class="control-group">
                <label>Flow Speed <span class="slider-value" id="flow-speed-val">0.5</span></label>
                <input type="range" id="flow-speed" min="0.1" max="2.0" value="0.5" step="0.1">
            </div>

            <div class="control-group">
                <label>Particle Size <span class="slider-value" id="particle-size-val">2</span></label>
                <input type="range" id="particle-size" min="1" max="10" value="2" step="1">
            </div>

            <div class="control-group">
                <label>Trail Length <span class="slider-value" id="trail-length-val">0.95</span></label>
                <input type="range" id="trail-length" min="0" max="0.99" value="0.95" step="0.01">
            </div>

            <div class="control-group">
                <label>Color Mode</label>
                <select id="color-mode">
                    <option value="heatmap">Heat Map (Blue→Red)</option>
                    <option value="velocity">Velocity-based</option>
                    <option value="position">Position-based</option>
                    <option value="white">Pure White</option>
                    <option value="rainbow">Rainbow Flow</option>
                </select>
            </div>

            <button id="reset-particles">Reset Particles</button>
        </div>

        <div id="fluid-controls" style="display:none;">
            <div class="control-group">
                <label>Dye Intensity <span class="slider-value" id="dye-intensity-val">5.0</span></label>
                <input type="range" id="dye-intensity" min="1" max="20" value="5.0" step="0.5">
            </div>

            <div class="control-group">
                <label>Fade Rate <span class="slider-value" id="fade-rate-val">0.995</span></label>
                <input type="range" id="fade-rate" min="0.90" max="0.999" value="0.995" step="0.001">
            </div>

            <div class="control-group">
                <label>Force Strength <span class="slider-value" id="fluid-force-val">100</span></label>
                <input type="range" id="fluid-force" min="10" max="300" value="100" step="10">
            </div>

            <button id="reset-fluid">Reset Fluid</button>
        </div>

        <div id="cloth-controls" style="display:none;">
            <div class="control-group">
                <label>Gravity <span class="slider-value" id="cloth-gravity-val">0.5</span></label>
                <input type="range" id="cloth-gravity" min="0" max="2" value="0.5" step="0.1">
            </div>

            <div class="control-group">
                <label>Stiffness <span class="slider-value" id="cloth-stiffness-val">0.9</span></label>
                <input type="range" id="cloth-stiffness" min="0.1" max="1.0" value="0.9" step="0.05">
            </div>

            <div class="control-group">
                <label>Force Strength <span class="slider-value" id="cloth-force-val">15</span></label>
                <input type="range" id="cloth-force" min="1" max="50" value="15" step="1">
            </div>

            <button id="reset-cloth">Reset Cloth</button>
        </div>

        <div id="boids-controls" style="display:none;">
            <div class="control-group">
                <label>Boid Count <span class="slider-value" id="boid-count-val">300</span></label>
                <input type="range" id="boid-count" min="50" max="1000" value="300" step="50">
            </div>

            <div class="control-group">
                <label>Separation <span class="slider-value" id="boid-separation-val">1.5</span></label>
                <input type="range" id="boid-separation" min="0.5" max="3.0" value="1.5" step="0.1">
            </div>

            <div class="control-group">
                <label>Avoidance <span class="slider-value" id="boid-avoidance-val">2.0</span></label>
                <input type="range" id="boid-avoidance" min="0.5" max="5.0" value="2.0" step="0.1">
            </div>

            <div class="control-group">
                <label>Trail Length <span class="slider-value" id="boid-trail-val">0.95</span></label>
                <input type="range" id="boid-trail" min="0" max="0.99" value="0.95" step="0.01">
            </div>

            <button id="reset-boids">Reset Boids</button>
        </div>

        <div id="wave-controls" style="display:none;">
            <div class="control-group">
                <label>Wave Speed <span class="slider-value" id="wave-speed-val">2</span></label>
                <input type="range" id="wave-speed" min="0.5" max="10" value="2" step="0.5">
            </div>

            <div class="control-group">
                <label>Wave Frequency <span class="slider-value" id="wave-frequency-val">0.1</span></label>
                <input type="range" id="wave-frequency" min="0.01" max="0.5" value="0.1" step="0.01">
            </div>

            <div class="control-group">
                <label>Amplitude <span class="slider-value" id="wave-amplitude-val">50</span></label>
                <input type="range" id="wave-amplitude" min="10" max="150" value="50" step="10">
            </div>

            <button id="reset-waves">Reset Waves</button>
        </div>

        <div id="rain-controls" style="display:none;">
            <div class="control-group">
                <label>Rain Intensity <span class="slider-value" id="rain-intensity-val">300</span></label>
                <input type="range" id="rain-intensity" min="50" max="1000" value="300" step="50">
            </div>

            <div class="control-group">
                <label>Drop Speed <span class="slider-value" id="drop-speed-val">8</span></label>
                <input type="range" id="drop-speed" min="1" max="20" value="8" step="1">
            </div>

            <div class="control-group">
                <label>Wind Strength <span class="slider-value" id="wind-strength-val">0.5</span></label>
                <input type="range" id="wind-strength" min="-5" max="5" value="0.5" step="0.5">
            </div>

            <div class="control-group">
                <label>Splash Intensity <span class="slider-value" id="splash-intensity-val">1.0</span></label>
                <input type="range" id="splash-intensity" min="0" max="3" value="1.0" step="0.1">
            </div>

            <div class="control-group">
                <label>Drop Size <span class="slider-value" id="drop-size-val">3</span></label>
                <input type="range" id="drop-size" min="1" max="8" value="3" step="1">
            </div>

            <div class="control-group">
                <label>Trail Length <span class="slider-value" id="rain-trail-val">0.85</span></label>
                <input type="range" id="rain-trail" min="0" max="0.99" value="0.85" step="0.01">
            </div>

            <div class="control-group">
                <label>Color Mode</label>
                <select id="rain-color-mode">
                    <option value="blue">Blue Rain</option>
                    <option value="white">White Rain</option>
                    <option value="rainbow">Rainbow Rain</option>
                    <option value="neon">Neon Rain</option>
                </select>
            </div>

            <button id="reset-rain">Reset Rain</button>
        </div>

        <div id="gravity-controls" style="display:none;">
            <div class="control-group">
                <label>Particle Count <span class="slider-value" id="gravity-particle-count-val">500</span></label>
                <input type="range" id="gravity-particle-count" min="100" max="2000" value="500" step="50">
            </div>

            <div class="control-group">
                <label>Gravitational Constant <span class="slider-value" id="g-constant-val">100</span></label>
                <input type="range" id="g-constant" min="10" max="500" value="100" step="10">
            </div>

            <div class="control-group">
                <label>Joint Mass <span class="slider-value" id="joint-mass-val">1000</span></label>
                <input type="range" id="joint-mass" min="100" max="5000" value="1000" step="100">
            </div>

            <div class="control-group">
                <label>Initial Speed <span class="slider-value" id="initial-speed-val">2</span></label>
                <input type="range" id="initial-speed" min="0" max="10" value="2" step="0.5">
            </div>

            <div class="control-group">
                <label>Drag <span class="slider-value" id="gravity-drag-val">0.999</span></label>
                <input type="range" id="gravity-drag" min="0.95" max="1.0" value="0.999" step="0.001">
            </div>

            <div class="control-group">
                <label>Particle Size <span class="slider-value" id="gravity-particle-size-val">3</span></label>
                <input type="range" id="gravity-particle-size" min="1" max="8" value="3" step="1">
            </div>

            <div class="control-group">
                <label>Trail Length <span class="slider-value" id="gravity-trail-val">0.95</span></label>
                <input type="range" id="gravity-trail" min="0" max="0.99" value="0.95" step="0.01">
            </div>

            <div class="control-group">
                <label>Color Mode</label>
                <select id="gravity-color-mode">
                    <option value="velocity">Velocity (Speed)</option>
                    <option value="energy">Energy (Heat Map)</option>
                    <option value="orbit">Orbital Type</option>
                    <option value="white">White</option>
                </select>
            </div>

            <div class="control-group">
                <label>
                    <input type="checkbox" id="show-field-lines">
                    Show Gravitational Field Lines
                </label>
            </div>

            <button id="reset-gravity">Reset Gravity</button>
        </div>

        <div id="water-waves-controls" style="display:none;">
            <div class="control-group">
                <label>Wave Speed <span class="slider-value" id="water-wave-speed-val">0.5</span></label>
                <input type="range" id="water-wave-speed" min="0.1" max="2.0" value="0.5" step="0.1">
            </div>

            <div class="control-group">
                <label>Damping <span class="slider-value" id="water-damping-val">0.99</span></label>
                <input type="range" id="water-damping" min="0.90" max="0.999" value="0.99" step="0.001">
            </div>

            <div class="control-group">
                <label>Disturbance Strength <span class="slider-value" id="disturbance-strength-val">100</span></label>
                <input type="range" id="disturbance-strength" min="10" max="500" value="100" step="10">
            </div>

            <div class="control-group">
                <label>Amplitude <span class="slider-value" id="water-amplitude-val">50</span></label>
                <input type="range" id="water-amplitude" min="10" max="200" value="50" step="10">
            </div>

            <div class="control-group">
                <label>Color Mode</label>
                <select id="water-color-mode">
                    <option value="height">Height (Blue Gradient)</option>
                    <option value="ocean">Ocean (Realistic)</option>
                    <option value="spectrum">Spectrum (Rainbow)</option>
                    <option value="thermal">Thermal (Heat Map)</option>
                </select>
            </div>

            <div class="control-group">
                <label>
                    <input type="checkbox" id="show-wave-normals">
                    Show Wave Normals
                </label>
            </div>

            <button id="reset-water-waves">Reset Waves</button>
        </div>

        <div id="moire-controls" style="display:none;">
            <div class="control-group">
                <label>Pattern Type</label>
                <select id="moire-pattern-type">
                    <option value="grids">Overlapping Grids</option>
                    <option value="circles">Concentric Circles</option>
                    <option value="lines">Line Gratings</option>
                    <option value="snakes">Rotating Snakes (Illusion)</option>
                    <option value="spiral">Fraser Spiral (Illusion)</option>
                    <option value="pinna">Pinna Rotation (Illusion)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Layer 1 Angle <span class="slider-value" id="layer1-angle-val">0</span></label>
                <input type="range" id="layer1-angle" min="0" max="180" value="0" step="1">
            </div>

            <div class="control-group">
                <label>Layer 2 Angle <span class="slider-value" id="layer2-angle-val">15</span></label>
                <input type="range" id="layer2-angle" min="0" max="180" value="15" step="1">
            </div>

            <div class="control-group">
                <label>Density/Spacing <span class="slider-value" id="moire-density-val">20</span></label>
                <input type="range" id="moire-density" min="5" max="100" value="20" step="1">
            </div>

            <div class="control-group">
                <label>Line Thickness <span class="slider-value" id="line-thickness-val">2</span></label>
                <input type="range" id="line-thickness" min="1" max="10" value="2" step="1">
            </div>

            <div class="control-group">
                <label>Animation Speed <span class="slider-value" id="animation-speed-val">1.0</span></label>
                <input type="range" id="animation-speed" min="0" max="5.0" value="1.0" step="0.1">
            </div>

            <div class="control-group">
                <label>Color Mode</label>
                <select id="moire-color-mode">
                    <option value="bw">Black & White</option>
                    <option value="color">Color</option>
                    <option value="inverted">Inverted</option>
                </select>
            </div>

            <div class="control-group">
                <label>
                    <input type="checkbox" id="auto-rotate" checked>
                    Auto Rotate (uncheck to use hands)
                </label>
            </div>

            <button id="reset-moire">Reset Pattern</button>
        </div>

        <div class="control-group">
            <label>Kinect Data Source</label>
            <select id="data-source">
                <option value="mock">Mock Data (Testing)</option>
                <option value="mouse">Mouse Input</option>
                <option value="kinect">Live Kinect</option>
            </select>
        </div>
    </div>

    <div id="fps">FPS: 60</div>

    <script src="visualizations/BaseVisualization.js"></script>
    <script src="visualizations/ParticleField.js"></script>
    <script src="visualizations/FluidDynamics.js"></script>
    <script src="visualizations/VerletCloth.js"></script>
    <script src="visualizations/Boids.js"></script>
    <script src="visualizations/WaveInterference.js"></script>
    <script src="visualizations/Rain.js"></script>
    <script src="visualizations/Gravity.js"></script>
    <script src="visualizations/WaterWaves.js"></script>
    <script src="visualizations/Moire.js"></script>
    <script src="visualizers.js"></script>
    <script src="app.js"></script>
</body>
</html>
